name: CI

# 触发：推送到 main / 打 v* 标签 / PR 到 main
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试 + 构建校验（Linux）
  test:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # 打 tag 时：打包 Windows EXE 并发布 Release（Windows）
  release:
    name: 打包并发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # 构建前端 + 用 @electron/packager 打包（ASCII 名称，规避中文编码）
      - name: 打包 EXE
        run: |
          npm run build
          npx @electron/packager . syllable-counter --platform=win32 --arch=x64 --out=release --overwrite --asar
      - name: 压缩为 zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/',''
          Compress-Archive -Path "release\syllable-counter-win32-x64\*" -DestinationPath "syllable-counter-$tag.zip" -CompressionLevel Optimal
      # 发布到对应 tag 的 Release（存在则追加资产）
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: syllable-counter-*.zip
          generate_release_notes: true
          draft: false
